name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://identity:identity@127.0.0.1:5432/identity
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Authorization code suite on PGlite (the guest's engine and adapter)
        env:
          IDENTITY_TEST_DATABASE: pglite
        run: bun --config=bunfig.pglite.toml test apps/server/tests/authorization-code.test.ts

  pglite-runner:
    name: Cutover pglite runner
    runs-on: ubuntu-latest
    defaults:
      run:
        # rust-toolchain.toml here pins the toolchain, the wasm32-wasip2 target and the components.
        working-directory: deploy/cutover/pglite-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --release --target wasm32-wasip2 -- -D warnings

      - name: Build
        run: cargo build --locked --release --target wasm32-wasip2
