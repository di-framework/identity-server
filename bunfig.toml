[test]
preload = [
  "./apps/guest/scripts/embed-migrations.ts",
  "./packages/core/tests/support/preload.ts",
  "./apps/api/scripts/generate-openapi.ts",
  "./apps/client/src/ui/dom.ts",
]
coverage = true
coverageSkipTestFiles = true
# Line, function, and statement coverage gates for every file the tests load.
coverageThreshold = { lines = 1, functions = 0.85, statements = 1 }
coveragePathIgnorePatterns = [
  "**/node_modules/**",
  "**/di-framework/packages/**",
  "**/T/identity-*/**",
  "**/apps/api/src/generated/**",
  # Test fixtures and fakes (fake SMTP and OIDC servers, key generators, databases).
  "**/tests/support/**",
]
